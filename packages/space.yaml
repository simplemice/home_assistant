###############################################################################
# @author      : Simplemice
# @package     : Space
# @description : Space Package
###############################################################################

sensor:
  #ISS Coordinates
  - platform: rest
    name: ISS Raw
    resource: "http://api.open-notify.org/iss-now.json"
    scan_interval: 30
    value_template: "{{ value_json.message }}"
    json_attributes:
      - iss_position
      - timestamp
device_tracker:
  - platform: mqtt_json
    devices:
      iss: location/iss

template:
  - sensor:
      - name: "ISS Latitude"
        unique_id: iss_latitude
        icon: mdi:latitude
        unit_of_measurement: "°"
        state_class: measurement
        availability: "{{ has_value('sensor.iss_raw') }}"
        state: >
          {{ (state_attr('sensor.iss_raw', 'iss_position') or {}).get('latitude', 0) | float(0) }}
      - name: "ISS Longitude"
        unique_id: iss_longitude
        icon: mdi:longitude
        unit_of_measurement: "°"
        state_class: measurement
        availability: "{{ has_value('sensor.iss_raw') }}"
        state: >
          {{ (state_attr('sensor.iss_raw', 'iss_position') or {}).get('longitude', 0) | float(0) }}
      - name: "ISS Last Update"
        unique_id: iss_last_update
        icon: mdi:clock
        device_class: timestamp
        availability: "{{ has_value('sensor.iss_raw') and state_attr('sensor.iss_raw', 'timestamp') is not none }}"
        state: >
          {{ as_datetime(state_attr('sensor.iss_raw', 'timestamp')) }}
automation:
  #Publish ISS Location data to MQTT Topic
  - id: iss_location_publish
    alias: "ISS Location Publish"
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - sensor.iss_latitude
          - sensor.iss_longitude
    action:
      - service: mqtt.publish
        data:
          topic: location/iss
          retain: true
          payload: >
            {
              "latitude": {{ states('sensor.iss_latitude') | float(0) }},
              "longitude": {{ states('sensor.iss_longitude') | float(0) }}
            }
