# ============================================================================
# Grid Package — Casa De Ratton (Simulated)
# ----------------------------------------------------------------------------
# CHANGES (2026-08-08 review):
#   1. "Grid Power Import" rewritten as a pure residual/balance sensor
#      (home - solar_to_home - wind_to_home - battery_discharge), replacing
#      the soc<=10 AND solar<10 threshold gate. The old gate produced two
#      confirmed bugs:
#        a) double-fed home by up to ~10W (import=full home load even while
#           a few W of solar were still landing on home directly)
#        b) a full brownout gap: soc<=10% + solar between 10W-home_load
#           satisfied neither the battery-discharge condition (soc<=10 forces
#           it off) nor the grid-import condition (needs solar<10 too) —
#           nothing covered the shortfall.
#      The residual formula can't do either; it always imports exactly what
#      solar+wind+battery didn't cover.
#   2. "Grid Power Export" rewritten as the residual on the generation side
#      ((solar+wind) - home - battery_charge_total), replacing the
#      soc>=100-gated version. This is now the SINGLE authoritative export
#      figure (solar package's own export sensor is now just an informational
#      split of this). It also naturally handles curtailment if combined
#      solar+wind excess exceeds the 3000W battery charge cap before SOC
#      hits 100% — the old version had no path for that case at all.
#   3. Renamed "Net Grid Power to Home 24h Avg" -> "Net Grid Power to Home"
#      since it was actually instantaneous (imp - exp), not an average.
#      Added a proper `statistics` platform sensor for the real 24h mean.
#   4. (REVERTED) Originally removed "Total Grid Energy Import Safe" as a
#      byte-for-byte duplicate of "Grid Energy Imported" — restored after
#      confirming it's wired into the Energy Dashboard config as a source
#      entity. Still a duplicate computation, but it's live-referenced
#      elsewhere so it stays. If you want to consolidate down to one entity,
#      that needs to happen on the Energy Dashboard side first (swap the
#      selected source), then the redundant sensor can be safely dropped here.
#
# STILL OPEN:
#   - Confirm whether a peak/off-peak tariff-switching automation
#     (input_select + utility_meter.next_tariff, PEA time-of-use) exists
#     elsewhere. Without it, "offpeak" bucket will stay at 0 forever and
#     everything accumulates under whatever the default tariff is.
# ============================================================================
template:
  - sensor:
      - name: "Grid Power Export"
        unique_id: grid_power_export_simulated
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:transmission-tower-export
        state: >
          {% set solar    = states('sensor.solar_live_power_simulated') | float(0) %}
          {% set wind     = states('sensor.wind_turbine_power_simulated') | float(0) %}
          {% set home     = states('sensor.sim_home_power') | float(0) %}
          {% set batt_chg = states('sensor.battery_charge_power_total') | float(0) %}
          {{ [(solar + wind) - home - batt_chg, 0] | max | round(1) }}

      - name: "Net Grid Power to Home"
        unique_id: net_grid_power_to_home
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:transmission-tower
        state: >
          {% set imp = states('sensor.grid_power_import_simulated') | float(0) %}
          {% set exp = states('sensor.grid_power_export_simulated') | float(0) %}
          {{ (imp - exp) | round(1) }}

      - name: "Grid Status"
        unique_id: grid_status
        icon: >
          {% set imp = states('sensor.grid_power_import_simulated') | float(0) %}
          {% set exp = states('sensor.grid_power_export_simulated') | float(0) %}
          {% if imp > 0 %}mdi:transmission-tower-import
          {% elif exp > 0 %}mdi:transmission-tower-export
          {% else %}mdi:transmission-tower-off{% endif %}
        state: >
          {% set imp = states('sensor.grid_power_import_simulated') | float(0) %}
          {% set exp = states('sensor.grid_power_export_simulated') | float(0) %}
          {% if imp > 0 %}Importing
          {% elif exp > 0 %}Exporting
          {% else %}Off-Grid{% endif %}

      - name: "Grid Energy Imported"
        unique_id: grid_energy_imported
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:transmission-tower
        state: >
          {{ states('sensor.total_grid_energy_import') | float(0) | round(3) }}

      - name: "Total Grid Energy Import Safe"
        unique_id: total_grid_energy_import_safe
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:transmission-tower
        state: >
          {{ states('sensor.total_grid_energy_import') | float(0) | round(3) }}

      - name: "Total Grid Energy Export Safe"
        unique_id: total_grid_energy_export_safe
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:transmission-tower-export
        state: >
          {{ states('sensor.total_grid_energy_export') | float(0) | round(3) }}

  - triggers:
      - trigger: time_pattern
        minutes: "/1"
    sensor:
      - name: "Grid Power Import"
        unique_id: grid_power_import_simulated
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:transmission-tower
        availability: >
          {{ has_value('sensor.sim_home_power') and has_value('sensor.solar_power_to_home')
             and has_value('sensor.wind_power_to_home') and has_value('sensor.battery_discharge_power_home') }}
        state: >-
          {% set solar_home = states('sensor.solar_power_to_home') | float(0) %}
          {% set wind_home  = states('sensor.wind_power_to_home') | float(0) %}
          {% set batt_dis   = states('sensor.battery_discharge_power_home') | float(0) %}
          {% set home       = states('sensor.sim_home_power') | float(0) %}
          {{ [home - solar_home - wind_home - batt_dis, 0] | max | round(1) }}
sensor:
  - platform: integration
    source: sensor.grid_power_import_simulated
    name: total_grid_energy_import
    unique_id: total_grid_energy_import
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    source: sensor.grid_power_export_simulated
    name: total_grid_energy_export
    unique_id: total_grid_energy_export
    unit_prefix: k
    round: 3
    method: left

  - platform: statistics
    name: "Net Grid Power to Home 24h Avg"
    unique_id: net_grid_power_to_home_24h_avg
    entity_id: sensor.net_grid_power_to_home
    state_characteristic: mean
    max_age:
      hours: 24
utility_meter:
  # Daily import split by tariff (peak/off-peak)
  # TODO: confirm the tariff-switching automation for these actually exists —
  # see note at top of file.
  grid_import_daily:
    source: sensor.total_grid_energy_import
    cycle: daily
    name: grid_import_daily
    tariffs:
      - peak
      - offpeak

  grid_import_monthly:
    source: sensor.total_grid_energy_import
    cycle: monthly
    name: grid_import_monthly
    tariffs:
      - peak
      - offpeak

  grid_import_yearly:
    source: sensor.total_grid_energy_import
    cycle: yearly
    name: grid_import_yearly
    tariffs:
      - peak
      - offpeak

  grid_export_daily:
    source: sensor.total_grid_energy_export
    cycle: daily
    name: grid_export_daily

  grid_export_monthly:
    source: sensor.total_grid_energy_export
    cycle: monthly
    name: grid_export_monthly

  grid_export_yearly:
    source: sensor.total_grid_energy_export
    cycle: yearly
    name: grid_export_yearly
