# Storage for Bubble Card Modules
template:
  - trigger:
      - trigger: event
        event_type: bubble_card_update_modules
    sensor:
      - name: "Bubble Card Modules"
        state: "saved"
        icon: "mdi:puzzle"
        attributes:
          modules: "{{ trigger.event.data.modules }}"
          last_updated: "{{ trigger.event.data.last_updated }}"

  - trigger:
      - platform: state
        entity_id: sensor.bedroom_temp_pressure
    sensor:
      - name: "Pressure Tendency"
        state: >
          {% set prev = trigger.from_state.state | float(0) %}
          {% set current = trigger.to_state.state | float(0) %}
          {% set diff = current - prev %}
          {% if diff > 0.1 %}
            rising
          {% elif diff < -0.1 %}
            falling
          {% else %}
            steady
          {% endif %}
        attributes:
          previous_pressure: "{{ trigger.from_state.state | float(0) }}"
          current_pressure: "{{ trigger.to_state.state | float(0) }}"
          difference: "{{ (trigger.to_state.state | float(0)) - (trigger.from_state.state | float(0)) }}"

  - sensor:
      - name: "ThinkPad T580 Power State"
        state: >
          {% set p = states('sensor.thinkpad_t580_power')| float(0) %}
          {% if p == 0 %} off
          {% elif p < 8 %} idle
          {% elif p < 20 %} light
          {% elif p < 35 %} work
          {% else %} heavy
          {% endif %}
  - triggers:
      - trigger: event
        event_type: flightradar24_area_landed
        id: landed
      - trigger: time
        at: "00:00:00"
        id: reset
    variables:
      d: "{{ trigger.event.data if trigger.id == 'landed' else {} }}"
      today: "{{ now().date().isoformat() }}"
      is_ru: >-
        {{ (d.airport_origin_country_code | default('', true) | upper | trim) == 'RU'
           or (d.airport_origin_city | default('', true) | lower | trim)
           in ['moscow', 'yekaterinburg', 'ekaterinburg', 'st. petersburg', 'saint petersburg', 'krasnoyarsk'] }}
      entry: >-
        {{ {'id': d.id,
            'flight': d.flight_number | default(d.callsign, true),
            'airline': d.airline | default('Unknown', true),
            'route': (d.airport_origin_city | default('Unknown', true)) ~ ' → ' ~ (d.airport_destination_city | default('Unknown', true))}
           if (trigger.id == 'landed' and (is_ru | bool(false))) else none }}
    sensor:
      - name: FlightRadar24 Russian Landed Today
        unique_id: flightradar24_russian_landed_today
        icon: mdi:airplane-landing
        unit_of_measurement: flights
        state: >-
          {% set a = this.attributes if this is not none else {} %}
          {% set prev = [] if (trigger.id == 'reset' or a.get('day', '') != today) else a.get('flights', []) %}
          {{ (prev + [entry] if (entry and entry.id not in (prev | map(attribute='id') | list)) else prev) | count }}
        attributes:
          day: "{{ today }}"
          flights: >-
            {% set a = this.attributes if this is not none else {} %}
            {% set prev = [] if (trigger.id == 'reset' or a.get('day', '') != today) else a.get('flights', []) %}
            {{ prev + [entry] if (entry and entry.id not in (prev | map(attribute='id') | list)) else prev }}
          landings_seen: >-
            {% set a = this.attributes if this is not none else {} %}
            {% set base = 0 if (trigger.id == 'reset' or a.get('day', '') != today) else (a.get('landings_seen', 0) | int(0)) %}
            {{ base + (1 if trigger.id == 'landed' else 0) }}
