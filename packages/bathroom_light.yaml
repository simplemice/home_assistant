###############################################################################
# Bathroom Light Package
# - Motion + door based entry detection
# - Smooth light on
# - After 5 min presence -> start long-occupancy timer (10 min)
# - After 15 min TOTAL presence (5 + 10) -> red flash warning, stays red
# - After 2 minutes of no motion -> turn off, reset everything
###############################################################################

input_boolean:
  bathroom_occupied:
    name: Bathroom Occupied
    icon: mdi:account

timer:
  bathroom_presence_warmup:
    name: Bathroom Presence Warmup
    duration: "00:05:00"

  bathroom_long_occupancy:
    name: Bathroom Long Occupancy
    duration: "00:10:00"

binary_sensor:
  - platform: group
    unique_id: bathroom_occupancy
    name: Bathroom Occupancy
    device_class: occupancy
    entities:
      - binary_sensor.bathroom_motion_occupancy
      - binary_sensor.bathroom_motion_sensor_occupancy

automation:
  ###############################################################################
  # Automation 1 - Start session on door open OR motion detected
  ###############################################################################
  - id: bathroom_start_session
    alias: "Bathroom - Start Session"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.bathroom_door_contact
        to: "on"
      - platform: state
        entity_id: binary_sensor.bathroom_occupancy
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.bathroom_occupied
        state: "off"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.bathroom_occupied
      - service: light.turn_on
        target:
          entity_id: light.bathroom_bulb
        data:
          brightness: 200
      - service: timer.start
        target:
          entity_id: timer.bathroom_presence_warmup

  ###############################################################################
  # Automation 2 - After 5 min of continuous presence, start the 10-min
  # long-occupancy timer. NOTE: this does NOT reset on motion - it tracks
  # total session time, not idle time, unlike the old keepalive automation.
  ###############################################################################
  - id: bathroom_warmup_finished
    alias: "Bathroom - Warmup Finished, Start Long Occupancy Timer"
    mode: single
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.bathroom_presence_warmup
    condition:
      - condition: state
        entity_id: input_boolean.bathroom_occupied
        state: "on"
    action:
      - service: timer.start
        target:
          entity_id: timer.bathroom_long_occupancy

  ###############################################################################
  # Automation 3 - End session (no motion for 2 min) -> cancel everything
  ###############################################################################
  - id: bathroom_end_session
    alias: "Bathroom - End Session (no motion 2min)"
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.bathroom_occupancy
        to: "off"
        for: "00:02:00"
    condition:
      - condition: state
        entity_id: input_boolean.bathroom_occupied
        state: "on"
    action:
      - service: light.turn_off
        target:
          entity_id: light.bathroom_bulb
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.bathroom_occupied
      - service: timer.cancel
        target:
          entity_id: timer.bathroom_presence_warmup
      - service: timer.cancel
        target:
          entity_id: timer.bathroom_long_occupancy

  ###############################################################################
  # Automation 4 - Long occupancy alert at 15 min total presence (5 + 10)
  # Stays red - does NOT revert back to warm light afterward.
  ###############################################################################
  - id: bathroom_long_occupancy_alert
    alias: "Bathroom - Long Occupancy Alert (15min)"
    mode: single
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.bathroom_long_occupancy
    condition:
      - condition: state
        entity_id: input_boolean.bathroom_occupied
        state: "on"
    action:
      - service: light.turn_on
        target:
          entity_id: light.bathroom_bulb
        data:
          color_name: "red"
          brightness: 255
      - repeat:
          count: 3
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.bathroom_bulb
              data:
                flash: short
            - delay: "00:00:02"
      - service: light.turn_on
        target:
          entity_id: light.bathroom_bulb
        data:
          color_name: "red"
          brightness: 255
