###############################################################################
#   @author         :   Simplemice
#   @date           :   27/01/2024
#   @package        :   PowerCalc
#   @description    :   PowerCalc
###############################################################################
sensor:
  - platform: integration
    source: sensor.total_lights_power
    name: Total Lights Energy
    unit_prefix: k
    round: 3
  - platform: integration
    source: sensor.thinkpad_t580_power
    name: ThinkPad T580 Energy
    unit_prefix: k
    round: 3
    method: trapezoidal
  - platform: integration
    source: sensor.sim_home_power
    name: Sim Home Energy
    unit_prefix: k
    round: 3
  - platform: integration
    source: sensor.kitchen_appliances_power
    name: Kitchen Appliances Energy
    unit_prefix: k
    round: 3
  - platform: integration
    source: sensor.climate_power
    name: Climate Energy
    unit_prefix: k
    round: 3

template:
  - sensor:
      - name: "Sim Home Power"
        unique_id: sim_home_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:home-lightning-bolt
        state: >
          {{
            states('sensor.home_office_power') | float(0) +
            states('sensor.kitchen_appliances_power') | float(0) +
            states('sensor.climate_power') | float(0) +
            states('sensor.lighting_power') | float(0) +
            states('sensor.media_power') | float(0)
          }}

      - name: "Media Power"
        unique_id: media_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:speaker
        state: >
          {{
            states('sensor.livingroom_player_power') | float(0) +
            states('sensor.bedroom_player_power') | float(0) +
            states('sensor.kitchen_player_power') | float(0) +
            states('sensor.tv_box_outlet_power') | float(0) +
            states('sensor.tv_outlet_power') | float(0)
          }}

      - name: "Climate Power"
        unique_id: climate_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:air-conditioner
        state: >
          {{
            states('sensor.bedroom_aircon_power_power') | float(0) +
            states('sensor.kitchen_fan_power_power') | float(0) +
            states('sensor.livingroom_fan_power_power') | float(0)
          }}

      - name: "Kitchen Appliances Power"
        unique_id: kitchen_appliances_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:chef-hat
        state: >
          {{
            states('sensor.rice_cooker_power_power') | float(0) +
            states('sensor.air_fryer_power_power') | float(0) +
            states('sensor.kettle_power_power') | float(0) +
            states('sensor.microwave_power_power') | float(0) +
            states('sensor.fridge_power_power') | float(0)
          }}

      - name: "Home Office Power"
        unique_id: home_office_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:laptop
        state: >
          {{ states('sensor.thinkpad_t580_power') | float(0) }}

      - name: "ThinkPad T580 Power"
        unique_id: thinkpad_t580_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:laptop
        state: >
          {% if states('sensor.micebook_idle') in ['unknown', 'unavailable'] %}
            0
          {% elif states('sensor.micebook_idle') | float > 300 %}
            2
          {% else %}
            {% set base     = 6 %}
            {% set cpu      = states('sensor.micebook_cpu_usage') | float(0) * 0.35 %}
            {% set screen   = 5 if is_state('switch.micebook_screen_onoff', 'on') else
          0 %}
            {% set charging = 30 if is_state('binary_sensor.micebook_battery_ac', 'on')
          else 0 %}
            {{ (base + cpu + screen + charging) | round(1) }}
          {% endif %}

      - name: "Sim Fridge Status"
        unique_id: sim_fridge_status
        icon: mdi:fridge
        state: >
          {% set hour = now().hour %}
          {% set minute_loop = (now().hour * 60 + now().minute) % 40 %}
          {% if hour == 3 and now().minute < 25 %}
            defrost
          {% elif minute_loop < 1 %}
            startup
          {% elif minute_loop < 20 %}
            cooling
          {% else %}
            idle
          {% endif %}

      - name: "Total Lights Power"
        unique_id: total_lights_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:lightbulb-group
        state: >
          {{
            states('sensor.wled_closet_strip_l_power') | float(0) +
            states('sensor.wled_closet_strip_r_power') | float(0) +
            states('sensor.wled_wall_light_power') | float(0) +
            states('sensor.wled_table_power') | float(0) +
            states('sensor.wled_tv_power') | float(0) +
            states('sensor.wled_undertv_power') | float(0) +
            states('sensor.wled_panel_power') | float(0) +
            states('sensor.porch_bulb_power') | float(0) +
            states('sensor.closet_lamp_power_power') | float(0) +
            states('sensor.wled_kitchen_closet_down_power') | float(0) +
            states('sensor.kitchen_fridge_light_power_power') | float(0) +
            states('sensor.awtrix_44dff8_power') | float(0) +
            states('sensor.bedroom_alarm_gateway_power') | float(0) +
            states('sensor.bedroom_bed_night_strip_power') | float(0)
          }}

      - name: "Lighting Power"
        unique_id: lighting_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:lightbulb-group
        state: >
          {{ states('sensor.total_lights_power') | float(0) }}

  - binary_sensor:
      - name: "Rice Cooker Cooking"
        unique_id: rice_cooker_cooking
        state: "{{ states('sensor.chunmi_c301_522e_cooker') == 'cooking' }}"

      - name: "Rice Cooker KeepWarm"
        unique_id: rice_cooker_keepwarm
        state: "{{ states('sensor.chunmi_c301_522e_cooker') == 'keepwarm' }}"

      - name: "Microwave Heating"
        unique_id: microwave_heating
        state: "false"
powercalc:
  sensors:
    - entity_id: fan.livingroom_fan
      name: "Livingroom Fan Power"
      standby_power: 0.5
      linear:
        min_power: 1.0
        max_power: 24.0

    - entity_id: light.kitchen_fridge_light
      name: "Kitchen Fridge Light Power"
      standby_power: 0.05
      fixed:
        power: 10

    - entity_id: light.bedroom_alarm_gateway_light
      name: "Bedroom Alarm Gateway Power"
      standby_power: 2.8
      fixed:
        power: 3.5

    - entity_id: light.awtrix_44dff8_matrix
      name: "awtrix_44dff8 Power"
      standby_power: 0.05
      fixed:
        states_power:
          "on": 2.8
          "off": 0.3

    - entity_id: sensor.sim_fridge_status
      name: "Fridge Power"
      manufacturer: "Generic"
      model: "Cyclic Fridge"
      standby_power: 1.8
      fixed:
        states_power:
          idle: 1.8
          cooling: 120
          startup: 450
          defrost: 240

    - entity_id: fan.kitchen_fan
      manufacturer: MITSUBISHI ELECTRIC
      model: R16-GA
      name: "Kitchen Fan Power"
      standby_power: 0.5
      fixed:
        power: 34.0

    - entity_id: sensor.chunmi_c301_522e_cooker
      manufacturer: Chunmi
      model: chunmi.cooker.eh3
      name: "Rice Cooker Power"
      standby_power: 0.8
      fixed:
        states_power:
          off: 0.8
          idle: 0.8
          cooking: 800
          shutdown: 0.8
          keepwarm: 350

    - entity_id: sensor.careli_maf01_68e5_air_fryer
      manufacturer: Careli
      model: careli.fryer.maf01
      name: "Air Fryer Power"
      standby_power: 0.8
      fixed:
        states_power:
          off: 0.8
          standby: 0.8
          shutdown: 0.8
          cooking: 1500
          idle: 0.8
          preheat: 1000
          paused: 0.8

    - entity_id: climate.aircon
      manufacturer: Eminent
      model: wfm12f
      name: "Bedroom Aircon Power"
      fixed:
        power: >
          {% set ac_entity = 'climate.aircon' %}
          {# Check if the AC is in a high-power mode (cool, dry, heat) #}
          {% if is_state(ac_entity, 'cool') or is_state(ac_entity, 'dry') %}
            965.00
            {# High power when compressor is running #}
          {% else %}
            350.0
            {# Low power when unit is on (fan only) or in another low-power mode #}
          {% endif %}
      standby_power: 0.5

    - entity_id: media_player.kitchen_speaker
      manufacturer: Xiaomi
      model: Mi Smart Speaker (A113X)
      name: "Kitchen Player Power"
      fixed:
        states_power:
          "playing": 12.0
          "idle": 3.0
          "off": 1.0
      standby_power: 0.5

    - entity_id: binary_sensor.microwave_heating
      manufacturer: Chunmi
      model: chunmi.microwave.n23l01
      name: "Microwave Power"

      fixed:
        power: 1200.0
      standby_power: 1.0

    - entity_id: light.bedroom_bed_strip
      manufacturer: Yeelink
      model: yeelink.light.strip2
      name: "Bedroom Bed Night Strip Power"

      linear:
        min_power: 1.0
        max_power: 18.0
      standby_power: 0.5

    - entity_id: light.closet_lamp
      manufacturer: Yeelink
      model: yeelink.light.bslamp2
      name: "Closet Lamp Power"
      linear:
        min_power: 0.5
        max_power: 10.0
      standby_power: 0.3

    - entity_id: switch.kettle
      manufacturer: Generic (Based on sticker type)
      model: KP-19S
      name: "Kettle Power"
      fixed:
        states_power:
          "on": 610.0
          "off": 0.5
      standby_power: 0.5

    - entity_id: light.porch_bulb
      manufacturer: Zemismart
      model: ZML2
      standby_power: 0.5
      linear:
        max_power: 9.0
        min_power: 1.0
